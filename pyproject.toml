[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MomentEmu"
version = "2.0.0"
description = "A lightweight, interpretable polynomial emulator with auto-differentiation support"
authors = [ { name = "Zheng Zhang", email = "zheng_zhang1@alumni.brown.edu" } ]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.13",
    "scikit-learn>=1.3",
]
keywords = ["emulator", "polynomial", "interpolation", "machine-learning", "scientific-computing", "autodiff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/zzhang0123/MomentEmu"
Repository = "https://github.com/zzhang0123/MomentEmu"
Documentation = "https://zzhang0123.github.io/MomentEmu/"
"Bug Tracker" = "https://github.com/zzhang0123/MomentEmu/issues"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
jax = ["jax>=0.4", "jaxlib"]
torch = ["torch>=2.0"]
all = ["jax>=0.4", "jaxlib", "torch>=2.0"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9", "mkdocstrings[python]>=0.24", "pymdown-extensions>=10"]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "pytest-timeout>=2",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.8",
    "build>=1.0",
    "twine>=5",
    "nbmake>=1.5",
    "cffconvert>=2",
    "mkdocs>=1.5",
    "mkdocs-material>=9",
    "mkdocstrings[python]>=0.24",
    "pymdown-extensions>=10",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib -p no:cacheprovider"
markers = [
    "slow: takes more than ~5 s; deselect with -m 'not slow'",
    "backend(name): requires the optional jax/torch extra",
]
filterwarnings = [
    "error::DeprecationWarning:MomentEmu",
]
[tool.coverage.run]
source = ["MomentEmu"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "def demo_.*:",
]
[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741", "B905", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E402", "E702", "B023", "F841"]
"benchmarks/**" = ["E402", "E702", "B023", "B007", "F841"]
"examples/**" = ["F841", "B007"]

[tool.mypy]
python_version = "3.10"
files = [
    "src/MomentEmu/__init__.py",
    "src/MomentEmu/emulator.py",
    "src/MomentEmu/core.py",
    "src/MomentEmu/io.py",
    "src/MomentEmu/monomials.py",
    "src/MomentEmu/guards.py",
    "src/MomentEmu/_stale_check.py",
]
warn_unused_ignores = true
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "sympy.*", "jax.*", "torch.*", "scipy.*", "cobaya.*", "getdist.*"]
ignore_missing_imports = true