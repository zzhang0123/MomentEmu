site_name: MomentEmu
site_url: https://zzhang0123.github.io/MomentEmu/
repo_url: https://github.com/zzhang0123/MomentEmu
edit_uri: edit/main/docs/
theme:
  name: material
  features: [navigation.sections, navigation.top, content.code.copy, search.highlight]
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: light mode}
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            members_order: source
            show_signature_annotations: true
markdown_extensions:
  - admonition
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex: {generic: true}
  - toc: {permalink: true}
extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - Start here:
    - Quick start: guide/quickstart.md
  - The method:
    - Moment projection: guide/method.md
    - Accuracy and conditioning: guide/numerics.md
  - Making the basis smaller:
    - Overview: guide/reduction.md
    - Prior truncation: guide/basis.md
    - Selection from the response: guide/sparse.md
    - Product structure: guide/factored.md
    - Better coordinates: guide/coordinates.md
  - Reading the model:
    - Diagnostics: guide/diagnostics.md
  - Deployment:
    - Save, load and cite an emulator: guide/persistence.md
    - Autodiff (JAX, PyTorch, SymPy): guide/autodiff.md
  - Reference:
    - Migrating from the flat module: guide/migration.md
  - API reference:
    - MomentEmu.emulator: api/polyemu.md
    - MomentEmu.core: api/core.md
    - MomentEmu.basis: api/basis.md
    - MomentEmu.monomials: api/monomials.md
    - MomentEmu.sparse: api/sparse.md
    - MomentEmu.factored: api/factored.md
    - MomentEmu.rotation: api/rotation.md
    - MomentEmu.warp: api/warp.md
    - MomentEmu.precondition: api/precondition.md
    - MomentEmu.recommend: api/recommend.md
    - MomentEmu.guards: api/guards.md
    - MomentEmu.io: api/io.md
    - MomentEmu.storage: api/storage.md
    - MomentEmu.jax_momentemu: api/jax.md
    - MomentEmu.torch_momentemu: api/torch.md
    - MomentEmu.symbolic_momentemu: api/symbolic.md
  - Changelog: changelog.md
