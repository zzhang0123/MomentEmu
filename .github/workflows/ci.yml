# .github/workflows/ci.yml
#
# One Python 3.12 leg on Linux and one on macOS (D5: widen the matrix once the
# Python floor is settled). The gates are numerical, not timing-based: fixed-seed
# fits must reproduce the pinned degree, basis size, test RMSE (1e-6 relative)
# and leading coefficients (1e-10 of the largest coefficient). Benchmark timings
# are uploaded as artifacts only and never fail the job.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: py${{ matrix.python }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Remove any stale flat MomentEmu.py from site-packages
        run: |
          python - <<PY
          import pathlib, site
          for d in site.getsitepackages() + [site.getusersitepackages()]:
              p = pathlib.Path(d) / "MomentEmu.py"
              if p.exists():
                  print("removing stale", p); p.unlink()
          PY
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]" pytest pytest-cov hypothesis
          python -m pip install "jax[cpu]" --extra-index-url https://pypi.org/simple
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Forbid the legacy flat test import
        # Regression guard for R1:autodiff-test-import-stale.
        run: |
          if grep -rn "from MomentEmu.MomentEmu import" tests; then
            echo "legacy flat import reintroduced in tests/"; exit 1;
          fi
      - name: Show resolved environment
        run: |
          python -c "import MomentEmu, pathlib; p = pathlib.Path(MomentEmu.__file__); assert p.parent.parent.name == 'src', p; print('MomentEmu from', p)"
      - name: pytest (numerical gates, coverage gate)
        run: python -m pytest tests -q --cov=MomentEmu --cov-branch --cov-fail-under=80
      - name: Benchmarks (timings only, never fail)
        if: ${{ hashFiles('benchmarks/__main__.py') != '' }}
        continue-on-error: true
        run: |
          python -m benchmarks --out ci_results --max-load 0 || true
          python -m benchmarks.report ci_results > ci_RESULTS.md 2>&1 || true
      - name: Upload benchmark timings
        if: ${{ hashFiles('benchmarks/__main__.py') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: timings-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ci_RESULTS.md
            ci_results/
          if-no-files-found: ignore